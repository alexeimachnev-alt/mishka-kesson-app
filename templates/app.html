<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Склад МИШКА</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --card: var(--tg-theme-secondary-bg-color, #232e3c);
      --text: var(--tg-theme-text-color, #f5f5f5);
      --hint: var(--tg-theme-hint-color, #7f8c99);
      --btn: var(--tg-theme-button-color, #2ea6ff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(255, 255, 255, 0.12);
    }
    body {
      margin: 0; padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    h2 { font-size: 1.15rem; text-align: center; margin: 4px 0 10px; }
    
    .tab-switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    .tab-btn {
      padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-weight: 700; font-size: 0.92rem;
      cursor: pointer; text-align: center;
    }
    .tab-btn.active {
      background: var(--btn); color: var(--btn-text); border-color: var(--btn);
    }

    .card {
      background: var(--card); border-radius: 12px; padding: 12px 14px;
      margin-bottom: 10px; border: 1px solid var(--border);
    }
    label { display: block; font-weight: 600; font-size: 0.82rem; margin-bottom: 5px; color: var(--text); }
    input, select {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 9px; font-size: 0.95rem;
      background: var(--bg); color: var(--text); outline: none;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .extra-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .extra-item:last-child { border-bottom: none; }
    .qty-ctrl { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: var(--btn); color: var(--btn-text); font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .qty-input {
      width: 58px !important; text-align: center; padding: 6px 4px !important;
      font-weight: 700; font-size: 0.9rem;
    }
    .unit-tag { font-size: 0.8rem; color: var(--hint); min-width: 24px; }
    .btn-submit {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--btn); color: var(--btn-text); font-size: 1.05rem;
      font-weight: 700; margin: 12px 0 20px; cursor: pointer;
    }
  </style>
</head>

  <h2 id="uiTitle">📦 Склад оборудования «МИШКА»</h2>

  <!-- Переключатель категорий -->
  <div class="tab-switch">
    <div class="tab-btn active" id="tabWell" onclick="switchMode('well')">💧 Кессон / Скважина</div>
    <div class="tab-btn" id="tabSeptic" onclick="switchMode('septic')">☣️ Септик / Слив</div>
  </div>

  <div class="card">
    <label id="lblLang">🌐 Язык интерфейса</label>
    <select id="langSelect" onchange="applyLanguage()">
      <option value="ru" selected>🇷🇺 Русский</option>
      <option value="tj">🇹🇯 Тоҷикӣ</option>
      <option value="uz">🇺🇿 Oʻzbekcha</option>
      <option value="hy">🇦🇲 Հայերեն</option>
      <option value="ky">🇰🇬 Кыргызча</option>
    </select>
  </div>

  <!-- РАЗДЕЛ: СКВАЖИНА И КЕССОН -->
  <div id="sectionWell">
    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblDepth">Глубина скважины (м)</label>
          <input type="number" id="depth" value="40" required>
        </div>
        <div>
          <label id="lblYield">Дебит (м³/ч)</label>
          <input type="number" step="0.1" id="yield" value="2.5" required>
        </div>
      </div>
    </div>

    <div class="card">
      <label id="lblHouses">Количество домов</label>
      <input type="number" id="houses" min="1" max="10" value="1" onchange="renderDistanceFields()" required>
      <div id="distanceContainer" style="margin-top: 8px;"></div>
    </div>

    <div class="card">
      <label id="lblKesson">Выбор кессона</label>
      <select id="kessonSelect">
        <option value="auto" id="optKessonAuto">🤝 На выбор продавца (автоподбор)</option>
        <option value="Мишка 1 (Ø1050)">Мишка 1 (Ø1050 мм)</option>
        <option value="Мишка 2 (Ø1300)">Мишка 2 (Ø1300 мм)</option>
        <option value="Мишка 3 (Ø1600)">Мишка 3 (Ø1600 мм)</option>
        <option value="Мишка 4 (Ø2100)">Мишка 4 (Ø2100 мм)</option>
        <option value="Мишка LONG (H=2500)">Мишка LONG (H=2500 мм)</option>
      </select>
    </div>

    <div class="card">
      <label id="lblExtras">Дополнительные расходники к скважине</label>
      <div id="extrasListWell"></div>
    </div>
  </div>

  <!-- РАЗДЕЛ: СЕПТИК И КАНАЛИЗАЦИЯ -->
  <div id="sectionSeptic" style="display: none;">
    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblUsers">Число проживающих</label>
          <select id="septicUsers">
            <option value="3">До 3 чел. (0.6 м³/сут)</option>
            <option value="5" selected>До 5 чел. (1.0 м³/сут)</option>
            <option value="8">До 8 чел. (1.6 м³/сут)</option>
            <option value="10">До 10 чел. (2.0 м³/сут)</option>
          </select>
        </div>
        <div>
          <label id="lblDischarge">Сброс очищенной воды</label>
          <select id="septicDischarge">
            <option value="gravity">Самотечный (дренаж)</option>
            <option value="forced">Принудительный (насос)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <label id="lblPipe110">Длина трассы канализации от дома (м)</label>
      <input type="number" id="septicDistance" value="10" required>
    </div>

    <div class="card">
      <label id="lblSepticModel">Модель септика</label>
      <select id="septicModelSelect">
        <option value="auto" id="optSepticAuto">🤝 На выбор продавца (автоподбор)</option>
        <option value="Септик МИШКА-Био 3">МИШКА-Био 3 (до 3 чел.)</option>
        <option value="Септик МИШКА-Био 5">МИШКА-Био 5 (до 5 чел.)</option>
        <option value="Септик МИШКА-Био 8">МИШКА-Био 8 (до 8 чел.)</option>
        <option value="Накопитель МИШКА 2.0 м³">Накопитель МИШКА 2.0 м³</option>
        <option value="Накопитель МИШКА 3.0 м³">Накопитель МИШКА 3.0 м³</option>
      </select>
    </div>

    <div class="card">
      <label id="lblExtrasSeptic">Расходные материалы для канализации</label>
      <div id="extrasListSeptic"></div>
    </div>
  </div>

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tabWell').classList.toggle('active', mode === 'well');
      document.getElementById('tabSeptic').classList.toggle('active', mode === 'septic');
      document.getElementById('sectionWell').style.display = mode === 'well' ? 'block' : 'none';
      document.getElementById('sectionSeptic').style.display = mode === 'septic' ? 'block' : 'none';
    }

    function applyLanguage() {
      const lang = document.getElementById('langSelect').value || 'ru';
      const t = I18N[lang] || I18N.ru;

      document.getElementById('uiTitle').innerText = t.title;
      document.getElementById('tabWell').innerText = t.tabWell;
      document.getElementById('tabSeptic').innerText = t.tabSeptic;
      document.getElementById('lblLang').innerText = t.lblLang;

      // Скважина
      document.getElementById('lblDepth').innerText = t.lblDepth;
      document.getElementById('lblYield').innerText = t.lblYield;
      document.getElementById('lblHouses').innerText = t.lblHouses;
      document.getElementById('lblKesson').innerText = t.lblKesson;
      document.getElementById('optKessonAuto').innerText = t.kessonAuto;
      document.getElementById('lblExtras').innerText = t.lblExtras;

      // Септик
      document.getElementById('lblUsers').innerText = t.lblUsers;
      document.getElementById('lblDischarge').innerText = t.lblDischarge;
      document.getElementById('lblPipe110').innerText = t.lblPipe110;
      document.getElementById('lblSepticModel').innerText = t.lblSepticModel;
      document.getElementById('optSepticAuto').innerText = t.septicAuto;
      document.getElementById('lblExtrasSeptic').innerText = t.lblExtrasSeptic;

      document.getElementById('btnSubmit').innerText = t.btnSubmit;

      renderDistanceFields();
      renderExtras();
    }

    function renderDistanceFields() {
      const lang = document.getElementById('langSelect').value || 'ru';
      const t = I18N[lang] || I18N.ru;
      const count = parseInt(document.getElementById('houses').value) || 1;
      const cont = document.getElementById('distanceContainer');
      
      const currentValues = [];
      for (let i = 1; i <= 10; i++) {
        const el = document.getElementById(`dist_${i}`);
        if (el) currentValues[i] = el.value;
      }

      cont.innerHTML = '';
      if (count === 1) {
        const val = currentValues[1] || 15;
        cont.innerHTML = `<label>${t.distSingle}</label><input type="number" id="dist_1" value="${val}" required>`;
      } else {
        for (let i = 1; i <= count; i++) {
          const val = currentValues[i] || (15 + (i - 1) * 5);
          const labelText = t.distMulti.replace('{i}', i);
          cont.innerHTML += `<div style="margin-bottom:6px;"><label>${labelText}</label><input type="number" id="dist_${i}" value="${val}" required></div>`;
        }
      }
    }

    function renderExtras() {
      const lang = document.getElementById('langSelect').value || 'ru';
      const t = I18N[lang] || I18N.ru;

      // Отрисовка расходников для скважины
      const listWell = document.getElementById('extrasListWell');
      listWell.innerHTML = '';
      extrasWell.forEach(item => {
        const val = extrasState[item.id] || 0;
        const name = t.items[item.id] || item.id;
        const unit = item.type === 'meters' ? t.unitM : t.unitPcs;

        listWell.innerHTML += `
          <div class="extra-item">
            <span style="font-size:0.86rem; flex:1; padding-right:8px;">${name}</span>
            <div class="qty-ctrl">
              <button class="qty-btn" type="button" onclick="stepDelta('${item.id}', -1)">−</button>
              <input class="qty-input" type="number" min="0" id="inp_${item.id}" value="${val}" oninput="manualSet('${item.id}', this.value)">
              <button class="qty-btn" type="button" onclick="stepDelta('${item.id}', 1)">+</button>
              <span class="unit-tag">${unit}</span>
            </div>
          </div>
        `;
      });

      // Отрисовка расходников для септика
      const listSeptic = document.getElementById('extrasListSeptic');
      listSeptic.innerHTML = '';
      extrasSeptic.forEach(item => {
        const val = extrasState[item.id] || 0;
        const name = t.items[item.id] || item.id;
        const unit = item.type === 'meters' ? t.unitM : t.unitPcs;

        listSeptic.innerHTML += `
          <div class="extra-item">
            <span style="font-size:0.86rem; flex:1; padding-right:8px;">${name}</span>
            <div class="qty-ctrl">
              <button class="qty-btn" type="button" onclick="stepDelta('${item.id}', -1)">−</button>
              <input class="qty-input" type="number" min="0" id="inp_${item.id}" value="${val}" oninput="manualSet('${item.id}', this.value)">
              <button class="qty-btn" type="button" onclick="stepDelta('${item.id}', 1)">+</button>
              <span class="unit-tag">${unit}</span>
            </div>
          </div>
        `;
      });
    }

    function stepDelta(id, delta) {
      const current = parseFloat(extrasState[id] || 0);
      const next = Math.max(0, current + delta);
      extrasState[id] = next;
      const el = document.getElementById(`inp_${id}`);
      if (el) el.value = next;
    }

    function manualSet(id, rawVal) {
      const val = parseFloat(rawVal);
      extrasState[id] = (!isNaN(val) && val >= 0) ? val : 0;
    }

    async function sendOrder() {
      const lang = document.getElementById('langSelect').value || 'ru';
      const t = I18N[lang] || I18N.ru;

      const selectedExtras = {};
      for (let key in extrasState) {
        if (extrasState[key] > 0) selectedExtras[key] = extrasState[key];
      }

      let payload = {
        mode: currentMode,
        lang: lang,
        extras: selectedExtras,
        user_id: tg?.initDataUnsafe?.user?.id || 0,
        username: tg?.initDataUnsafe?.user?.username || "",
        first_name: tg?.initDataUnsafe?.user?.first_name || "Монтажник"
      };

      if (currentMode === 'well') {
        const hCount = parseInt(document.getElementById('houses').value) || 1;
        const distances = [];
        for (let i = 1; i <= hCount; i++) {
          distances.push(parseFloat(document.getElementById(`dist_${i}`)?.value || 15));
        }
        payload.depth = parseFloat(document.getElementById('depth').value) || 40;
        payload.yield_flow = parseFloat(document.getElementById('yield').value) || 2.5;
        payload.houses = hCount;
        payload.distances = distances;
        payload.chosen_kesson = document.getElementById('kessonSelect').value;
      } else {
        payload.users = parseInt(document.getElementById('septicUsers').value) || 5;
        payload.discharge = document.getElementById('septicDischarge').value;
        payload.distance = parseFloat(document.getElementById('septicDistance').value) || 10;
        payload.chosen_septic = document.getElementById('septicModelSelect').value;
      }

      const btn = document.getElementById('btnSubmit');
      btn.innerText = t.sending;
      btn.disabled = true;

      try {
        const res = await fetch('/api/miniapp_order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          if (tg) {
            tg.showAlert(t.successMsg);
            tg.close();
          } else {
            alert(t.successMsg);
          }
        } else {
          alert("Ошибка отправки заказа.");
          btn.disabled = false;
          btn.innerText = t.btnSubmit;
        }
      } catch (e) {
        alert("Сбой соединения: " + e);
        btn.disabled = false;
        btn.innerText = t.btnSubmit;
      }
    }

    applyLanguage();
  </script>
</body>
</html>
