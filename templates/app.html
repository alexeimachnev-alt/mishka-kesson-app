<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Склад МИШКА</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --card: var(--tg-theme-secondary-bg-color, #232e3c);
      --text: var(--tg-theme-text-color, #f5f5f5);
      --hint: var(--tg-theme-hint-color, #7f8c99);
      --btn: var(--tg-theme-button-color, #2ea6ff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(255, 255, 255, 0.12);
    }
    body {
      margin: 0; padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    h2 { font-size: 1.15rem; text-align: center; margin: 4px 0 10px; }
    
    .tab-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px;
    }
    .tab-btn {
      padding: 10px 6px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-weight: 700; font-size: 0.82rem;
      cursor: pointer; text-align: center; transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--btn); color: var(--btn-text); border-color: var(--btn);
    }

    .card {
      background: var(--card); border-radius: 12px; padding: 12px 14px;
      margin-bottom: 10px; border: 1px solid var(--border);
    }
    label { display: block; font-weight: 600; font-size: 0.82rem; margin-bottom: 5px; color: var(--text); }
    input, select {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 9px; font-size: 0.95rem;
      background: var(--bg); color: var(--text); outline: none;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .extra-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .extra-item:last-child { border-bottom: none; }
    .qty-ctrl { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: var(--btn); color: var(--btn-text); font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .qty-input {
      width: 58px !important; text-align: center; padding: 6px 4px !important;
      font-weight: 700; font-size: 0.9rem;
    }
    .unit-tag { font-size: 0.8rem; color: var(--hint); min-width: 24px; }
    .btn-submit {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--btn); color: var(--btn-text); font-size: 1.05rem;
      font-weight: 700; margin: 12px 0 20px; cursor: pointer;
    }
    .phone-card {
      border: 1.5px solid var(--btn) !important;
      background: rgba(46, 166, 255, 0.08) !important;
    }
  </style>
</head>
<body>

  <h2 id="uiTitle">📦 Склад оборудования «МИШКА»</h2>

  <!-- Сетка переключения 4-х разделов -->
  <div class="tab-grid">
    <div class="tab-btn active" id="tabWell" onclick="switchMode('well')">💧 Скважина / Кессон</div>
    <div class="tab-btn" id="tabSeptic" onclick="switchMode('septic')">☣️ Септик / Слив</div>
    <div class="tab-btn" id="tabDrainage" onclick="switchMode('drainage')">🌾 Дренаж участка</div>
    <div class="tab-btn" id="tabStorm" onclick="switchMode('storm')">🌧 Ливнёвка в земле</div>
  </div>

  <div class="card">
    <label id="lblLang">🌐 Язык интерфейса</label>
    <select id="langSelect" onchange="applyLanguage()">
      <option value="ru" selected>🇷🇺 Русский</option>
      <option value="tj">🇹🇯 Тоҷикӣ</option>
      <option value="uz">🇺🇿 Oʻzbekcha</option>
      <option value="hy">🇦🇲 Հայերեն</option>
      <option value="ky">🇰🇬 Кыргызча</option>
    </select>
  </div>

  <!-- РАЗДЕЛ 1: СКВАЖИНА И КЕССОН -->
  <div id="sectionWell">
    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblDepth">Глубина скважины (м)</label>
          <input type="number" id="depth" value="40" required>
        </div>
        <div>
          <label id="lblYield">Дебит (м³/ч)</label>
          <input type="number" step="0.1" id="yield" value="2.5" required>
        </div>
      </div>
    </div>

    <div class="card">
      <label id="lblHouses">Количество домов</label>
      <input type="number" id="houses" min="1" max="10" value="1" onchange="renderDistanceFields()" required>
      <div id="distanceContainer" style="margin-top: 8px;"></div>
    </div>

    <div class="card">
      <label id="lblKesson">Выбор кессона</label>
      <select id="kessonSelect">
        <option value="auto" id="optKessonAuto">🤝 На выбор продавца (автоподбор)</option>
        <option value="Мишка 1 (Ø1050)">Мишка 1 (Ø1050 мм)</option>
        <option value="Мишка 2 (Ø1300)">Мишка 2 (Ø1300 мм)</option>
        <option value="Мишка 3 (Ø1600)">Мишка 3 (Ø1600 мм)</option>
        <option value="Мишка 4 (Ø2100)">Мишка 4 (Ø2100 мм)</option>
        <option value="Мишка LONG (H=2500)">Мишка LONG (H=2500 мм)</option>
      </select>
    </div>

    <div class="card">
      <label id="lblExtras">Расходники к скважине</label>
      <div id="extrasListWell"></div>
    </div>
  </div>

  <!-- РАЗДЕЛ 2: СЕПТИК И КАНАЛИЗАЦИЯ -->
  <div id="sectionSeptic" style="display: none;">
    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblUsers">Число проживающих</label>
          <select id="septicUsers">
            <option value="3">До 3 чел. (0.6 м³/сут)</option>
            <option value="5" selected>До 5 чел. (1.0 м³/сут)</option>
            <option value="8">До 8 чел. (1.6 м³/сут)</option>
            <option value="10">До 10 чел. (2.0 м³/сут)</option>
          </select>
        </div>
        <div>
          <label id="lblDischarge">Сброс очищенной воды</label>
          <select id="septicDischarge">
            <option value="gravity">Самотечный (дренаж)</option>
            <option value="forced">Принудительный (насос)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <label id="lblPipe110">Длина трассы канализации от дома (м)</label>
      <input type="number" id="septicDistance" value="10" required>
    </div>

    <div class="card">
      <label id="lblSepticModel">Модель септика</label>
      <select id="septicModelSelect">
        <option value="auto" id="optSepticAuto">🤝 На выбор продавца (автоподбор)</option>
        <option value="Септик МИШКА-Био 3">МИШКА-Био 3 (до 3 чел.)</option>
        <option value="Септик МИШКА-Био 5">МИШКА-Био 5 (до 5 чел.)</option>
        <option value="Септик МИШКА-Био 8">МИШКА-Био 8 (до 8 чел.)</option>
        <option value="Накопитель МИШКА 2.0 м³">Накопитель МИШКА 2.0 м³</option>
        <option value="Накопитель МИШКА 3.0 м³">Накопитель МИШКА 3.0 м³</option>
      </select>
    </div>

    <div class="card">
      <label id="lblExtrasSeptic">Расходные материалы для канализации</label>
      <div id="extrasListSeptic"></div>
    </div>
  </div>

  <!-- РАЗДЕЛ 3: ДРЕНАЖ УЧАСТКА -->
  <div id="sectionDrainage" style="display: none;">
    <div class="card">
      <label id="lblDrainType">Тип дренажной системы</label>
      <select id="drainTypeSelect">
        <option value="softrock" selected>📦 «Софтрок» / Лайтдрок (без щебня, в наполнителе)</option>
        <option value="classic">🧱 Классический дренаж (труба в щебне + геотекстиль)</option>
      </select>
    </div>

    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblDrainLen">Общая длина трассы (м)</label>
          <input type="number" id="drainLength" value="50" required>
        </div>
        <div>
          <label id="lblDrainWells">Смотровых колодцев (шт.)</label>
          <input type="number" id="drainWells" value="3" required>
        </div>
      </div>
    </div>

    <div class="card">
      <label id="lblExtrasDrain">Расходники для дренажа</label>
      <div id="extrasListDrain"></div>
    </div>
  </div>

  <!-- РАЗДЕЛ 4: ПОДЗЕМНАЯ ЛИВНЁВКА -->
  <div id="sectionStorm" style="display: none;">
    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblInlets">Дождеприёмников (шт.)</label>
          <input type="number" id="stormInlets" value="4" required>
        </div>
        <div>
          <label id="lblStormLen">Длина подземной трубы 110 (м)</label>
          <input type="number" id="stormLength" value="30" required>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblStormWells">Поворотных колодцев (шт.)</label>
          <input type="number" id="stormWells" value="2" required>
        </div>
        <div>
          <label id="lblStormDischarge">Точка сброса ливнёвки</label>
          <select id="stormDischarge">
            <option value="ditch">Канава / овраг</option>
            <option value="well">Поглотительный колодец</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <label id="lblExtrasStorm">Расходники для ливнёвки</label>
      <div id="extrasListStorm"></div>
    </div>
  </div>

  <!-- КОНТАКТНЫЙ ТЕЛЕФОН -->
  <div class="card phone-card">
    <label id="lblPhone">📞 Номер телефона для связи и бронирования</label>
    <input type="tel" id="contactPhone" placeholder="+7 (___) ___-__-__" required>
  </div>
