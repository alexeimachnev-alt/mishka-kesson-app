<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Склад МИШКА</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #17212b;
      --card: #232e3c;
      --text: #f5f5f5;
      --hint: #7f8c99;
      --btn: #2ea6ff;
      --btn-text: #ffffff;
      --border: rgba(255, 255, 255, 0.12);
    }
    body {
      margin: 0; padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    h2 { font-size: 1.15rem; text-align: center; margin: 4px 0 10px; }
    
    .tab-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px;
    }
    .tab-btn {
      padding: 10px 4px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-weight: 700; font-size: 0.8rem;
      cursor: pointer; text-align: center; user-select: none;
    }
    .tab-btn.active {
      background: var(--btn) !important; color: var(--btn-text) !important; border-color: var(--btn) !important;
    }

    .card {
      background: var(--card); border-radius: 12px; padding: 12px 14px;
      margin-bottom: 10px; border: 1px solid var(--border);
    }
    label { display: block; font-weight: 600; font-size: 0.82rem; margin-bottom: 5px; color: var(--text); }
    input, select {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 9px; font-size: 0.95rem;
      background: var(--bg); color: var(--text); outline: none;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .extra-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .extra-item:last-child { border-bottom: none; }
    .qty-ctrl { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: var(--btn); color: var(--btn-text); font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-weight: bold;
    }
    .qty-input {
      width: 55px !important; text-align: center; padding: 6px 2px !important;
      font-weight: 700; font-size: 0.9rem;
    }
    .unit-tag { font-size: 0.8rem; color: var(--hint); min-width: 24px; text-align: left; }
    
    .btn-submit {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--btn); color: var(--btn-text); font-size: 1.05rem;
      font-weight: 700; margin: 12px 0 24px; cursor: pointer;
    }
    .highlight-card {
      border: 1.5px solid var(--btn) !important;
    }
  </style>
</head>
<body>

  <h2 id="uiTitle">📦 Склад оборудования «МИШКА»</h2>

  <!-- 4 вкладки -->
  <div class="tab-grid">
    <div class="tab-btn active" id="btnTabWell" onclick="selectTab('well')">💧 Скважина / Кессон</div>
    <div class="tab-btn" id="btnTabSeptic" onclick="selectTab('septic')">☣️ Септик / Слив</div>
    <div class="tab-btn" id="btnTabDrain" onclick="selectTab('drainage')">🌾 Дренаж участка</div>
    <div class="tab-btn" id="btnTabStorm" onclick="selectTab('storm')">🌧 Ливнёвка в земле</div>
  </div>

  <div class="card">
    <label id="lblLang">🌐 Язык интерфейса</label>
    <select id="langSelect" onchange="onLanguageChanged()">
      <option value="ru" selected>🇷🇺 Русский</option>
      <option value="tj">🇹🇯 Тоҷикӣ</option>
      <option value="uz">🇺🇿 Oʻzbekcha</option>
      <option value="hy">🇦🇲 Հայերեն</option>
      <option value="ky">🇰🇬 Кыргызча</option>
    </select>
  </div>

  <!-- РАЗДЕЛ 1: СКВАЖИНА -->
  <div id="secWell">
    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblDepth">Глубина скважины (м)</label>
          <input type="number" id="depth" value="40">
        </div>
        <div>
          <label id="lblYield">Дебит (м³/ч)</label>
          <input type="number" step="0.1" id="yield" value="2.5">
        </div>
      </div>
    </div>

    <div class="card">
      <label id="lblHouses">Количество домов</label>
      <input type="number" id="houses" min="1" max="10" value="1" oninput="renderDistances()">
      <div id="distanceContainer" style="margin-top: 8px;"></div>
    </div>

    <div class="card">
      <label id="lblKesson">Выбор кессона</label>
      <select id="kessonSelect">
        <option value="auto" id="optKessonAuto">🤝 На выбор продавца (автоподбор)</option>
        <option value="Мишка 1 (Ø1050)">Мишка 1 (Ø1050 мм)</option>
        <option value="Мишка 2 (Ø1300)">Мишка 2 (Ø1300 мм)</option>
        <option value="Мишка 3 (Ø1600)">Мишка 3 (Ø1600 мм)</option>
        <option value="Мишка 4 (Ø2100)">Мишка 4 (Ø2100 мм)</option>
        <option value="Мишка LONG (H=2500)">Мишка LONG (H=2500 мм)</option>
      </select>
    </div>

    <div class="card">
      <label id="lblExtrasWell">Расходники к скважине</label>
      <div id="boxExtrasWell"></div>
    </div>
  </div>

  <!-- РАЗДЕЛ 2: СЕПТИК -->
  <div id="secSeptic" style="display: none;">
    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblUsers">Число проживающих</label>
          <select id="septicUsers">
            <option value="3" id="optUsers3">До 3 чел. (0.6 м³/сут)</option>
            <option value="5" id="optUsers5" selected>До 5 чел. (1.0 м³/сут)</option>
            <option value="8" id="optUsers8">До 8 чел. (1.6 м³/сут)</option>
            <option value="10" id="optUsers10">До 10 чел. (2.0 м³/сут)</option>
          </select>
        </div>
        <div>
          <label id="lblDischarge">Сброс очищенной воды</label>
          <select id="septicDischarge">
            <option value="gravity" id="optDisGrav">Самотечный (дренаж)</option>
            <option value="forced" id="optDisForce">Принудительный (насос)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <label id="lblPipe110">Длина трассы канализации (м)</label>
      <input type="number" id="septicDistance" value="10">
    </div>

    <div class="card">
      <label id="lblSepticModel">Модель септика</label>
      <select id="septicModelSelect">
        <option value="auto" id="optSepticAuto">🤝 На выбор продавца (автоподбор)</option>
        <option value="Септик МИШКА-Био 3">МИШКА-Био 3 (до 3 чел.)</option>
        <option value="Септик МИШКА-Био 5">МИШКА-Био 5 (до 5 чел.)</option>
        <option value="Септик МИШКА-Био 8">МИШКА-Био 8 (до 8 чел.)</option>
        <option value="Накопитель МИШКА 2.0 м³">Накопитель МИШКА 2.0 м³</option>
        <option value="Накопитель МИШКА 3.0 м³">Накопитель МИШКА 3.0 м³</option>
      </select>
    </div>

    <div class="card">
      <label id="lblExtrasSeptic">Расходники для канализации</label>
      <div id="boxExtrasSeptic"></div>
    </div>
  </div>

  <!-- РАЗДЕЛ 3: ДРЕНАЖ -->
  <div id="secDrain" style="display: none;">
    <div class="card">
      <label id="lblDrainType">Тип дренажной системы</label>
      <select id="drainTypeSelect">
        <option value="softrock" id="optDrainSoft" selected>📦 «Софтрок» / Лайтдрок (без щебня)</option>
        <option value="classic" id="optDrainClass">🧱 Классический (труба в щебне + геотекстиль)</option>
      </select>
    </div>

    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblDrainLen">Длина трассы (м)</label>
          <input type="number" id="drainLength" value="50">
        </div>
        <div>
          <label id="lblDrainWells">Колодцев (шт.)</label>
          <input type="number" id="drainWells" value="3">
        </div>
      </div>
    </div>

    <div class="card">
      <label id="lblExtrasDrain">Расходники для дренажа</label>
      <div id="boxExtrasDrain"></div>
    </div>
  </div>

  <!-- РАЗДЕЛ 4: ЛИВНЁВКА -->
  <div id="secStorm" style="display: none;">
    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblInlets">Дождеприёмников (шт.)</label>
          <input type="number" id="stormInlets" value="4">
        </div>
        <div>
          <label id="lblStormLen">Длина трубы 110 (м)</label>
          <input type="number" id="stormLength" value="30">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="grid-2">
        <div>
          <label id="lblStormWells">Колодцев (шт.)</label>
          <input type="number" id="stormWells" value="2">
        </div>
        <div>
          <label id="lblStormDischarge">Сброс воды</label>
          <select id="stormDischarge">
            <option value="ditch" id="optStormDitch">Канава / овраг</option>
            <option value="well" id="optStormWell">Поглотительный колодец</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <label id="lblExtrasStorm">Расходники для ливнёвки</label>
      <div id="boxExtrasStorm"></div>
    </div>
  </div>

  <!-- ЛОГИСТИКА: САМОВЫВОЗ ИЛИ ДОСТАВКА -->
  <div class="card highlight-card">
    <label id="lblLogistics">🚚 Способ получения заказа</label>
    <select id="logisticsType" onchange="toggleLogisticsFields()">
      <option value="pickup" id="optLogPickup" selected>📦 Самовывоз со склада (п. Некрасовский)</option>
      <option value="delivery" id="optLogDelivery">🚛 Доставка на объект заказчика</option>
    </select>

    <div id="pickupBox" style="margin-top: 8px;">
      <label id="lblPickupTime">Дата и время приезда на склад</label>
      <input type="text" id="pickupDateTime" placeholder="Сегодня к 15:30 или завтра утром">
    </div>

    <div id="deliveryBox" style="display: none; margin-top: 8px;">
      <label id="lblDeliveryAddress">Точный адрес доставки или координаты</label>
      <input type="text" id="deliveryAddress" placeholder="МО, Дмитровский р-н, д. Подосинки...">
      <label id="lblDeliveryTime" style="margin-top: 6px;">Желаемое время доставки</label>
      <input type="text" id="deliveryTime" placeholder="Завтра с 10:00 до 14:00">
    </div>
  </div>

  <!-- ТЕЛЕФОН -->
  <div class="card highlight-card">
    <label id="lblPhone">📞 Номер телефона для связи</label>
    <input type="tel" id="contactPhone" placeholder="+7 (900) 000-00-00">
  </div>

  <button class="btn-submit" id="btnSubmit" onclick="sendOrder()">🚀 Отправить заказ на склад</button>

    function selectTab(mode) {
      activeTab = mode;
      const tabMap = {
        well: { btn: 'btnTabWell', sec: 'secWell' },
        septic: { btn: 'btnTabSeptic', sec: 'secSeptic' },
        drainage: { btn: 'btnTabDrain', sec: 'secDrain' },
        storm: { btn: 'btnTabStorm', sec: 'secStorm' }
      };

      for (let k in tabMap) {
        const b = document.getElementById(tabMap[k].btn);
        const s = document.getElementById(tabMap[k].sec);
        if (b) b.classList.toggle('active', k === mode);
        if (s) s.style.display = (k === mode) ? 'block' : 'none';
      }
    }

      const isDelivery = document.getElementById('logisticsType').value === 'delivery';
      document.getElementById('pickupBox').style.display = isDelivery ? 'none' : 'block';
      document.getElementById('deliveryBox').style.display = isDelivery ? 'block' : 'none';
    }

    function renderDistances() {
      const lang = document.getElementById('langSelect').value || 'ru';
      const t = DICT[lang] || DICT.ru;
      const count = parseInt(document.getElementById('houses').value) || 1;
      const cont = document.getElementById('distanceContainer');
      if (!cont) return;

      const currentVals = [];
      for (let i = 1; i <= 10; i++) {
        const inp = document.getElementById('dist_' + i);
        if (inp) currentVals[i] = inp.value;
      }

      cont.innerHTML = '';
      if (count === 1) {
        const v = currentVals[1] || 15;
        cont.innerHTML = `<label>${t.distSingle}</label><input type="number" id="dist_1" value="${v}">`;
      } else {
        for (let i = 1; i <= count; i++) {
          const v = currentVals[i] || (15 + (i - 1) * 5);
          const txt = t.distMulti.replace('{i}', i);
          cont.innerHTML += `<div style="margin-bottom:6px;"><label>${txt}</label><input type="number" id="dist_${i}" value="${v}"></div>`;
        }
      }
    }

    function renderBox(prefix, boxId, list) {
      const box = document.getElementById(boxId);
      if (!box) return;
      const lang = document.getElementById('langSelect').value || 'ru';
      const t = DICT[lang] || DICT.ru;

      box.innerHTML = '';
      list.forEach(item => {
        const val = userQuantities[item.id] || 0;
        const name = (t.items && t.items[item.id]) ? t.items[item.id] : item.id;
        const unit = (item.type === 'meters') ? t.unitM : t.unitPcs;
        const inputDomId = `inp_${prefix}_${item.id}`;

        const row = document.createElement('div');
        row.className = 'extra-item';
        row.innerHTML = `
          <span style="font-size:0.86rem; flex:1; padding-right:8px;">${name}</span>
          <div class="qty-ctrl">
            <button class="qty-btn" type="button" onclick="modifyQty('${item.id}', -1, '${prefix}')">−</button>
            <input class="qty-input" type="number" min="0" id="${inputDomId}" value="${val}" oninput="setQtyManual('${item.id}', this.value)">
            <button class="qty-btn" type="button" onclick="modifyQty('${item.id}', 1, '${prefix}')">+</button>
            <span class="unit-tag">${unit}</span>
          </div>
        `;
        box.appendChild(row);
      });
    }

    function renderAllItems() {
      renderBox('well', 'boxExtrasWell', CATALOG.well);
      renderBox('septic', 'boxExtrasSeptic', CATALOG.septic);
      renderBox('drain', 'boxExtrasDrain', CATALOG.drainage);
      renderBox('storm', 'boxExtrasStorm', CATALOG.storm);
    }

    function modifyQty(id, delta, prefix) {
      const cur = parseFloat(userQuantities[id] || 0);
      const next = Math.max(0, cur + delta);
      userQuantities[id] = next;
      
      ['well', 'septic', 'drain', 'storm'].forEach(p => {
        const el = document.getElementById(`inp_${p}_${id}`);
        if (el) el.value = next;
      });
    }

    function setQtyManual(id, raw) {
      const v = parseFloat(raw);
      const next = (!isNaN(v) && v >= 0) ? v : 0;
      userQuantities[id] = next;
      ['well', 'septic', 'drain', 'storm'].forEach(p => {
        const el = document.getElementById(`inp_${p}_${id}`);
        if (el) el.value = next;
      });
    }

    async function sendOrder() {
      const lang = document.getElementById('langSelect').value || 'ru';
      const t = DICT[lang] || DICT.ru;

      const phone = document.getElementById('contactPhone').value.trim();
      if (!phone || phone.length < 6) {
        if (tg) { tg.showAlert(t.errPhone); } else { alert(t.errPhone); }
        document.getElementById('contactPhone').focus();
        return;
      }

      const logisticsType = document.getElementById('logisticsType').value;
      let deliveryDetails = "";

      if (logisticsType === 'pickup') {
        deliveryDetails = document.getElementById('pickupDateTime').value.trim() || "Самовывоз со склада";
      } else {
        const addr = document.getElementById('deliveryAddress').value.trim();
        if (!addr) {
          if (tg) { tg.showAlert(t.errDelivery); } else { alert(t.errDelivery); }
          document.getElementById('deliveryAddress').focus();
          return;
        }
        const dTime = document.getElementById('deliveryTime').value.trim() || "В течение дня";
        deliveryDetails = `Адрес: ${addr} | Время: ${dTime}`;
      }

      const activeExtras = {};
      for (let k in userQuantities) {
        if (userQuantities[k] > 0) activeExtras[k] = userQuantities[k];
      }

      let payload = {
        mode: activeTab,
        lang: lang,
        phone: phone,
        delivery_type: logisticsType === 'delivery' ? 'Доставка на объект' : 'Самовывоз со склада',
        delivery_info: deliveryDetails,
        extras: activeExtras,
        user_id: tg?.initDataUnsafe?.user?.id || 0,
        username: tg?.initDataUnsafe?.user?.username || "",
        first_name: tg?.initDataUnsafe?.user?.first_name || "Монтажник"
      };

      if (activeTab === 'well') {
        const hCount = parseInt(document.getElementById('houses').value) || 1;
        const distances = [];
        for (let i = 1; i <= hCount; i++) {
          distances.push(parseFloat(document.getElementById('dist_' + i)?.value || 15));
        }
        payload.depth = parseFloat(document.getElementById('depth').value) || 40;
        payload.yield_flow = parseFloat(document.getElementById('yield').value) || 2.5;
        payload.houses = hCount;
        payload.distances = distances;
        payload.chosen_kesson = document.getElementById('kessonSelect').value;
      } else if (activeTab === 'septic') {
        payload.users = parseInt(document.getElementById('septicUsers').value) || 5;
        payload.discharge = document.getElementById('septicDischarge').value;
        payload.distance = parseFloat(document.getElementById('septicDistance').value) || 10;
        payload.chosen_septic = document.getElementById('septicModelSelect').value;
      } else if (activeTab === 'drainage') {
        payload.drain_type = document.getElementById('drainTypeSelect').value;
        payload.drain_length = parseFloat(document.getElementById('drainLength').value) || 50;
        payload.drain_wells = parseInt(document.getElementById('drainWells').value) || 3;
      } else if (activeTab === 'storm') {
        payload.storm_inlets = parseInt(document.getElementById('stormInlets').value) || 4;
        payload.storm_length = parseFloat(document.getElementById('stormLength').value) || 30;
        payload.storm_wells = parseInt(document.getElementById('stormWells').value) || 2;
        payload.storm_discharge = document.getElementById('stormDischarge').value;
      }

      const btn = document.getElementById('btnSubmit');
      btn.innerText = t.sending;
      btn.disabled = true;

      try {
        const res = await fetch('/api/miniapp_order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          if (tg) {
            tg.showAlert(t.successMsg);
            tg.close();
          } else {
            alert(t.successMsg);
          }
        } else {
          alert("Ошибка отправки заказа.");
          btn.disabled = false;
          btn.innerText = t.btnSubmit;
        }
      } catch (err) {
        alert("Сбой соединения: " + err);
        btn.disabled = false;
        btn.innerText = t.btnSubmit;
      }
    }

    onLanguageChanged();
  </script>
</body>
</html>
